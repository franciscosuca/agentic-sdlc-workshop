name: Build and Release

on:
  push:
    branches:
      - main
      - pre-release
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SR_VERSION: '24.1.0'
  SR_CHANGELOG_VERSION: '6.0.3'
  SR_COMMIT_ANALYZER_VERSION: '13.0.1'
  SR_GIT_VERSION: '10.0.1'
  SR_GITHUB_VERSION: '11.0.6'
  SR_NPM_VERSION: '12.0.2'
  SR_RELEASE_NOTES_VERSION: '14.1.0'
  CC_CONVENTIONALCOMMITS_VERSION: '8.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ]; then
            bun install --frozen-lockfile
          else
            echo "No package.json found; skipping dependency installation."
          fi

      - name: Run tests (if any)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ] && python -c "import json, pathlib; print('test' in json.loads(pathlib.Path('package.json').read_text()).get('scripts', {}))" | grep -qx 'True'; then
            bun run --if-present test
          else
            echo "No test script found; skipping tests."
          fi

      - name: Build web application
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package.json ]; then
            bun run build
          else
            echo "No package.json found; skipping build."
          fi

      - name: Setup Pages
        if: hashFiles('dist') != ''
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: hashFiles('dist') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release_tools_dir="$(mktemp -d)"
          trap 'rm -rf "$release_tools_dir"' EXIT

          bun install --cwd "$release_tools_dir" --no-save \
            semantic-release@${SR_VERSION} \
            @semantic-release/changelog@${SR_CHANGELOG_VERSION} \
            @semantic-release/commit-analyzer@${SR_COMMIT_ANALYZER_VERSION} \
            @semantic-release/git@${SR_GIT_VERSION} \
            @semantic-release/github@${SR_GITHUB_VERSION} \
            @semantic-release/npm@${SR_NPM_VERSION} \
            @semantic-release/release-notes-generator@${SR_RELEASE_NOTES_VERSION} \
            conventional-changelog-conventionalcommits@${CC_CONVENTIONALCOMMITS_VERSION}

          NODE_PATH="$release_tools_dir/node_modules" \
            bun "$release_tools_dir/node_modules/semantic-release/bin/semantic-release.js"

  deploy-pages:
    needs: build-and-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
